schema_version: 1
id: DA-010
family: DarkAct
title: OBB 目标显著性 sqrt(HW) 通道注意力版
parent_id: DA-009
lifecycle:
  status: auto
  recovery_confidence: confirmed
hypothesis: 按实际点积长度 H*W 缩放通道注意力 logits，可减少 P3 Softmax 饱和并保留有效梯度。
change_from_parent: 仅将 FP32 目标显著性 attention 的除数从 sqrt(active_channels) 改为 sqrt(H*W)。
architecture:
  summary: C2f/SPPF -> FP32 sqrt(HW) target saliency -> full-C PaperLAF feedback
  version: v3
  stages:
  - P3
  - P4
  - P5
  heads: HNA
  flow:
    P3: C2f stage -> FP32 sqrt(HW) target saliency + OBB loss -> full-C PaperLAF feedback
    P4: C2f stage -> FP32 sqrt(HW) target saliency + OBB loss -> full-C PaperLAF feedback
    P5: C2f/SPPF stage -> FP32 sqrt(HW) target saliency + OBB loss -> full-C PaperLAF
      feedback
files:
  model_yaml: yaml/yolov8s-DarkAct-TargetSaliency-PaperLAF-P345-SqrtHW-v3.yaml
  train_entrypoint: train_dronevehicle_darkact_target_saliency_sqrthw.py
  migration_script: tools/make_twostream_obb_weights_darkact_target_saliency_sqrthw.py
  init_checkpoint: pre-pth/yolov8s-obb_twostream_darkact_target_saliency_paperlaf_p345_sqrthw_v3.pt
  module_files:
  - ultralytics/nn/modules/darkact_maalaf_v3.py
  - ultralytics/nn/modules/darkact_target_saliency.py
  - ultralytics/nn/modules/darkact_target_saliency_stable_attention.py
  - ultralytics/models/yolo/obb/target_saliency_train.py
  - tools/darkact_target_saliency_variant_migration.py
  integration_files:
  - ultralytics/nn/modules/__init__.py
  - ultralytics/nn/tasks.py
training:
  profile: experiments/profiles/dronevehicle_obb_100e.yaml
  launch_mode: checkpoint
  trainer_class: ultralytics.models.yolo.obb.target_saliency_train:TargetSaliencyOBBTrainer
  output:
    project: runs/DroneVehicle_OBB/train-labels=official-v1/darkact/mainline/DA-010__target-saliency-sqrthw
    name: attempt=01
    layout: seeded-v1
legacy:
  run_dir: null
  relocated_runs: experiments/run_registry.yaml
reports: []
notes:
- 注意力仍为 C_a x C_a 通道注意力，不是 H*W x H*W 空间注意力。
- 直接从 pre-pth/yolov8s-obb.pt 迁移，不经由 DA-009 或其他中间 checkpoint。
- 使用固定迁移随机种子 0，与 DA-009/DA-011 的所有共有初始化张量逐值相同。
- 该缩放不是论文 sqrt(C) 公式，属于 OBB 单帧适配的稳定化消融。
