schema_version: 1
id: DA-011
family: DarkAct
title: OBB 目标显著性 L2 归一化与可学习温度版
parent_id: DA-009
lifecycle:
  status: auto
  recovery_confidence: confirmed
hypothesis: 用空间响应的余弦相似度和可学习温度限制 logits 幅值，可在不同分辨率下避免 Softmax 饱和。
change_from_parent: Q/K 沿 H*W 做 L2 normalization，以每尺度、每模态一个可学习 tau 替代 sqrt(C) 缩放，V
  保持未归一化。
architecture:
  summary: C2f/SPPF -> FP32 L2+temperature target saliency -> full-C PaperLAF feedback
  version: v4
  stages:
  - P3
  - P4
  - P5
  heads: HNA
  flow:
    P3: C2f stage -> FP32 L2+temperature target saliency + OBB loss -> full-C PaperLAF
      feedback
    P4: C2f stage -> FP32 L2+temperature target saliency + OBB loss -> full-C PaperLAF
      feedback
    P5: C2f/SPPF stage -> FP32 L2+temperature target saliency + OBB loss -> full-C
      PaperLAF feedback
files:
  model_yaml: yaml/yolov8s-DarkAct-TargetSaliency-PaperLAF-P345-L2Temp-v4.yaml
  train_entrypoint: train_dronevehicle_darkact_target_saliency_l2temp.py
  migration_script: tools/make_twostream_obb_weights_darkact_target_saliency_l2temp.py
  init_checkpoint: pre-pth/yolov8s-obb_twostream_darkact_target_saliency_paperlaf_p345_l2temp_v4.pt
  module_files:
  - ultralytics/nn/modules/darkact_maalaf_v3.py
  - ultralytics/nn/modules/darkact_target_saliency.py
  - ultralytics/nn/modules/darkact_target_saliency_stable_attention.py
  - ultralytics/models/yolo/obb/target_saliency_train.py
  - tools/darkact_target_saliency_variant_migration.py
  integration_files:
  - ultralytics/nn/modules/__init__.py
  - ultralytics/nn/tasks.py
training:
  profile: experiments/profiles/dronevehicle_obb_100e.yaml
  launch_mode: checkpoint
  trainer_class: ultralytics.models.yolo.obb.target_saliency_train:TargetSaliencyOBBTrainer
  output:
    project: runs/DroneVehicle_OBB/train-labels=official-v1/darkact/mainline/DA-011__target-saliency-l2temp
    name: attempt=01
    layout: seeded-v1
legacy:
  run_dir: null
  relocated_runs: experiments/run_registry.yaml
reports: []
notes:
- 注意力仍为 C_a x C_a 通道注意力，Q/K 做 L2 归一化，V 保留原显著性特征幅值。
- 每个 P3/P4/P5 尺度的 RGB/IR 分支各新增一个 tau，共 6 个参数，初值 0.2，forward 范围为 0.05 至 2.0。
- 直接从 pre-pth/yolov8s-obb.pt 迁移，不经由 DA-009 或其他中间 checkpoint。
- 使用固定迁移随机种子 0，与 DA-009/DA-010 的所有共有初始化张量逐值相同，仅多 6 个 temperature。
- 该方法不是论文 sqrt(C) 公式，属于稳定化改进实验。
