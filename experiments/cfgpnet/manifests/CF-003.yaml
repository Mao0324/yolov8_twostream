schema_version: 1
id: CF-003
family: CFGPNet
title: P3/P4/P5 纯 CrossCEA 空间可靠性交换
parent_id: CF-001
lifecycle:
  status: created
  recovery_confidence: confirmed
hypothesis: 若 ASAF 式强响应选择对无人机小目标造成噪声放大，仅保留跨模态可靠性交换会有更稳定的 mAP50。
change_from_parent: 保持 P3/P4/P5 CrossCEA，但移除候选选择与模态 MLP，仅对交互后的双流特征求和。
architecture:
  summary: CrossCEA reliability exchange only on P3/P4/P5
  version: v1
  stages: [P3, P4, P5]
  heads: grouped-axis-4-8-8
  flow:
    P3: CrossCEA(groups=4) -> sum
    P4: CrossCEA(groups=8) -> sum
    P5: CrossCEA(groups=8) -> sum
files:
  model_yaml: yaml/cfgpnet_crosscea_only_p345.yaml
  train_entrypoint: train_dronevehicle_cfgpnet_crosscea_only_p345.py
  migration_script: tools/make_cfgpnet_checkpoints_from_yolov8s.py
  init_checkpoint: pre-pth/yolov8s-obb_twostream_cfgp_crosscea_only_p345.pt
  module_files:
    - ultralytics/nn/modules/cfgp_fusion.py
  integration_files:
    - ultralytics/nn/modules/__init__.py
    - ultralytics/nn/tasks.py
    - tools/train_experiment.py
    - tools/test_experiment.py
    - tools/training_monitor.py
training:
  profile: experiments/profiles/dronevehicle_obb_100e.yaml
  launch_mode: checkpoint
  trainer_class: ultralytics.models.yolo.obb.train:OBBTrainer
  output:
    project: runs/DroneVehicle_OBB_CFGPNet
    name: CFGP_CF003_CrossCEAOnly_P345_v1
legacy:
  run_dir: null
reports: []
notes:
  - 与 CF-001 构成 ASAF 选择聚合消融。
  - 这是三种变体中参数增量最小的版本。
