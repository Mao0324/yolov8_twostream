schema_version: 1
id: CF-001
family: CFGPNet
title: P3/P4/P5 CrossCEA + 轻量 ASAF 选择聚合
parent_id: BL-001
lifecycle:
  status: created
  recovery_confidence: confirmed
hypothesis: 交换跨模态空间可靠性并在三个候选融合响应中保留强响应，可降低背景冗余并提升 DroneVehicle 测试集 mAP50。
change_from_parent: 仅将 baseline 的 P3/P4/P5 ADD 替换为零初始化 CFGPCrossAttentionFusion；backbone、neck、OBB head 与训练配置不变。
architecture:
  summary: CrossCEA reliability exchange + max-selected lightweight ASAF on P3/P4/P5
  version: v1
  stages: [P3, P4, P5]
  heads: grouped-axis-4-8-8
  flow:
    P3: CrossCEA(groups=4) -> candidate max selection
    P4: CrossCEA(groups=8) -> candidate max selection
    P5: CrossCEA(groups=8) -> candidate max selection
files:
  model_yaml: yaml/cfgpnet_crosscea_asaf_p345.yaml
  train_entrypoint: train_dronevehicle_cfgpnet.py
  migration_script: tools/make_cfgpnet_checkpoints.py
  init_checkpoint: pre-pth/yolov8s-obb_twostream_cfgp_crosscea_asaf_p345.pt
  module_files:
    - ultralytics/nn/modules/cfgp_fusion.py
  integration_files:
    - ultralytics/nn/modules/__init__.py
    - ultralytics/nn/tasks.py
    - tools/train_experiment.py
    - tools/training_monitor.py
training:
  profile: experiments/profiles/dronevehicle_obb_100e.yaml
  launch_mode: checkpoint
  trainer_class: ultralytics.models.yolo.obb.train:OBBTrainer
  output:
    project: runs/DroneVehicle_OBB_CFGPNet
    name: CFGP_CF001_CrossCEA_ASAF_P345_v1
legacy:
  run_dir: null
reports: []
notes:
  - residual_scale=0，迁移后初始函数严格等价于 baseline ADD。
  - 不引入论文的 GELAN backbone 或常驻辅助检测头，首轮只测跨模态交互和融合收益。
