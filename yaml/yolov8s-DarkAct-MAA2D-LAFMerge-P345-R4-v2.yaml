#
# 来源与改造说明：
# 本架构是 DarkAct MAA/LAF 向单帧 RGB/热红外 OBB 检测迁移的 V2 独立变体。
# 它新增 StaticMAA2D 与 LAFMergeFeedback2D，不修改旧 MAA2D、LAFMerge2D
# 以及 yolov8s-DarkAct-MAA2D-LAFMerge-P345-R4.yaml 的任何结构或含义。
#
# StaticMAA2D（P3/P4/P5）：
#   1. 用同模态 K3/K5 多尺度空间结构差异替代论文的相邻帧时间差异，生成 E^S；
#   2. 恢复局部 AP/MP + 1x1 MLP + W_M^A，生成空间容忍 Query E^Q；
#   3. 展平 E^Q/E^S 后计算 C/4 通道相关矩阵，并由 E^S 生成 Value 输出；
#   4. 投影结果经 sigmoid 形成增强门控，beta=softplus(raw_beta)>0，初值 0.01，
#      Y=G*(1+beta*gate)，只允许显著性增强，不再出现负 beta 压制 IR。
# RGB 和 IR 始终独立计算静态显著性，不使用 RGB-IR 直接差分。
#
# LAFMergeFeedback2D（P3/P4/P5）：
#   保留 V1 LAFMerge2D 的全局/局部门控和 C/4 跨模态 Value 交互；neck 使用完整
#   F_fused，同时将 Delta=F_fused-(F_rgb+F_ir) 加回 RGB/IR 两条流，继续输入后续
#   backbone stage。LAF 零初始化时 Delta=0，因此迁移权重的训练起点保持原双流行为。

nc: 5
scales:
  # n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]
scale: s

backbone:
  # RGB 分支：提取至 P3/8。
  - [-5, 1, Conv, [64, 3, 2]]                              # 0 RGB-P1/2
  - [-5, 1, Conv, [128, 3, 2]]                             # 1 RGB-P2/4
  - [-5, 3, C2f, [128, True]]                              # 2
  - [-5, 1, Conv, [256, 3, 2]]                             # 3 RGB-P3/8

  # IR 分支：提取至 P3/8。
  - [-6, 1, Conv, [64, 3, 2]]                              # 4 IR-P1/2
  - [-6, 1, Conv, [128, 3, 2]]                             # 5
  - [-6, 3, C2f_Faster, [128, True]]                       # 6
  - [-6, 1, Conv, [256, 3, 2]]                             # 7 IR-P3/8

  # P3 Static MAA：s 尺度实际 C=128，active C/4=32，dilation=1。
  # 参数：[未缩放通道数, partial_ratio, dilation, beta_init, K3/K5, query_kernel]
  - [-3, 1, StaticMAA2D, [256, 4, 1, 0.01, [3, 5], 3]]    # 8
  - [-5, 6, C2f, [256, True]]                              # 9 RGB-P3
  - [-6, 6, C2f_Faster, [256, True]]                       # 10 IR-P3
  # 输出 F_fused 供 neck；学习修正同步反馈两条流，供 P4 stage 使用。
  - [[9, 10], 1, LAFMergeFeedback2D, [256, 2, 4, 1, 8]]   # 11 P3 fused/feedback

  - [-5, 1, Conv, [512, 3, 2]]                             # 12 RGB-P4/16
  - [-6, 1, Conv, [512, 3, 2]]                             # 13 IR-P4/16

  # P4 Static MAA：实际 C=256，active C/4=64，dilation=2。
  - [-3, 1, StaticMAA2D, [512, 4, 2, 0.01, [3, 5], 3]]    # 14
  - [-5, 6, C2f, [512, True]]                              # 15 RGB-P4
  - [-6, 6, C2f_Faster, [512, True]]                       # 16 IR-P4
  - [[15, 16], 1, LAFMergeFeedback2D, [512, 4, 4, 2, 8]]  # 17 P4 fused/feedback

  - [-5, 1, Conv, [1024, 3, 2]]                            # 18 RGB-P5/32
  - [-6, 1, Conv, [1024, 3, 2]]                            # 19 IR-P5/32

  # P5 Static MAA：实际 C=512，active C/4=128，dilation=2。
  - [-3, 1, StaticMAA2D, [1024, 4, 2, 0.01, [3, 5], 3]]   # 20
  - [-5, 3, C2f, [1024, True]]                             # 21 RGB-P5
  - [-5, 1, SPPF, [1024, 5]]                              # 22
  - [-6, 3, C2f_Faster, [1024, True]]                      # 23 IR-P5
  - [-6, 1, SPPF, [1024, 5]]                              # 24
  - [[22, 24], 1, LAFMergeFeedback2D, [1024, 8, 4, 2, 8]] # 25 P5 fused/feedback

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]           # 26
  - [[-1, 17], 1, Concat, [1]]                            # 27 P5 up + P4 fused
  - [-1, 3, C2f, [512]]                                   # 28
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]           # 29
  - [[-1, 11], 1, Concat, [1]]                            # 30 P4 up + P3 fused
  - [-1, 3, C2f, [256]]                                   # 31 P3/8
  - [-1, 1, Conv, [256, 3, 2]]                            # 32
  - [[-1, 28], 1, Concat, [1]]                            # 33
  - [-1, 3, C2f, [512]]                                   # 34 P4/16
  - [-1, 1, Conv, [512, 3, 2]]                            # 35
  - [[-1, 25], 1, Concat, [1]]                            # 36
  - [-1, 3, C2f, [1024]]                                  # 37 P5/32
  - [[31, 34, 37], 1, OBB, [nc, 1]]                       # 38
