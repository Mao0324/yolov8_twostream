# Strict DA016-parent ablation D.
#
# Inheritance is intentionally stage-specific and introduces no new fusion class:
#   - common parent: original DA016 SemanticDisagreementLAF at P3/P4;
#   - Prompt supervision: inherited unchanged from ablation B at both P3 and P4;
#   - P3 detection path: inherits ablation C's zero-init bounded Prompt residual;
#   - P4 detection path: inherits ablation B exactly, so Prompt is auxiliary-only;
#   - P5: unchanged original DarkACT LAF.
#
# Therefore D differs from B by exactly one scalar P3 residual-gain parameter,
# and differs from C only by removing the P4 Prompt residual from detection.

nc: 5
scales:
  s: [0.33, 0.50, 1024]
scale: s

# Identical to B/C: two frozen teachers supervise both P3 and P4 Prompt heads.
p2_object_reliability_stages: [P3, P4]
p2_object_reliability_stage_weights: [1.0, 0.5]
p2_object_reliability_gain: 0.10
p2_object_reliability_warmup_epochs: 5
p2_object_support_sigma: 0.7
p2_object_minimum_cells: 2.0
p2_object_reduce_chunk_size: 64
p2_object_calibration_ratio: 1.0
p2_object_balanced_ratio: 0.0
p2_object_hard_winner_gain: 1.0
p2_object_soft_calibration_gain: 0.25
p2_object_hard_winner_min_margin: 0.10
p2_object_rank_gain: 0.20
p2_object_rank_max_objects: 128
p2_object_rank_min_gap: 0.10
p2_object_confidence_floor: 0.25
p2_object_gate_direction_stage_gains: [0.0, 0.0]
p2_object_cross_scale_consistency_gain: 0.0
p2_teacher_temperature: 0.2
p2_teacher_match_topk: 128

backbone:
  - [-5, 1, Conv, [64, 3, 2]]
  - [-5, 1, Conv, [128, 3, 2]]
  - [-5, 3, C2f, [128, True]]
  - [-5, 1, Conv, [256, 3, 2]]
  - [-6, 1, Conv, [64, 3, 2]]
  - [-6, 1, Conv, [128, 3, 2]]
  - [-6, 3, C2f_Faster, [128, True]]
  - [-6, 1, Conv, [256, 3, 2]]
  - [-5, 6, C2f, [256, True]]
  - [-6, 6, C2f_Faster, [256, True]]
  # P3 = C: DA016 base + alpha*(P_rgb-P_ir)*(F_rgb-F_ir)/2, alpha starts at 0.
  - [[8, 9], 1, DA016DualPromptResidualSemanticLAFMergeFeedback2D, [256, 2, 4, 1, 8, 4, 0.25]]
  - [-5, 1, Conv, [512, 3, 2]]
  - [-6, 1, Conv, [512, 3, 2]]
  - [-5, 6, C2f, [512, True]]
  - [-6, 6, C2f_Faster, [512, True]]
  # P4 = B: DA016 base is returned unchanged; Prompt exists only for auxiliary loss.
  - [[13, 14], 1, DA016DualPromptAuxSemanticLAFMergeFeedback2D, [512, 4, 4, 2, 8, 4]]
  - [-5, 1, Conv, [1024, 3, 2]]
  - [-6, 1, Conv, [1024, 3, 2]]
  - [-5, 3, C2f, [1024, True]]
  - [-5, 1, SPPF, [1024, 5]]
  - [-6, 3, C2f_Faster, [1024, True]]
  - [-6, 1, SPPF, [1024, 5]]
  # P5 remains the original DarkACT LAF in A/B/C/D.
  - [[19, 21], 1, LAFMergeFeedback2D, [1024, 8, 4, 2, 8]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 15], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 25], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 22], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]
  - [[28, 31, 34], 1, OBB, [nc, 1]]
