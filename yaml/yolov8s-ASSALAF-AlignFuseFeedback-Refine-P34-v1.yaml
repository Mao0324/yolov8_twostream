# ASSANet + DarkAct, align-then-fuse (v1)
# P3/P4: partial ASSA alignment -> LAF fusion/feedback -> fused refine
# P5: LAF fusion/feedback only. This avoids redundant low-resolution attention.
nc: 5
scales:
  s: [0.33, 0.50, 1024]
scale: s

backbone:
  - [-5, 1, Conv, [64, 3, 2]]
  - [-5, 1, Conv, [128, 3, 2]]
  - [-5, 3, C2f, [128, True]]
  - [-5, 1, Conv, [256, 3, 2]]
  - [-6, 1, Conv, [64, 3, 2]]
  - [-6, 1, Conv, [128, 3, 2]]
  - [-6, 3, C2f_Faster, [128, True]]
  - [-6, 1, Conv, [256, 3, 2]]

  - [-5, 6, C2f, [256, True]]
  - [-6, 6, C2f_Faster, [256, True]]
  # C/4 ASSA alignment (H2, static DW3, no FFN), then original LAF (R4/D1).
  - [[8, 9], 1, ASSALAFMergeFeedback2D, [256, 2, 4, 3, 0.1, 1, 8]]

  - [-5, 1, Conv, [512, 3, 2]]
  - [-6, 1, Conv, [512, 3, 2]]
  - [-5, 6, C2f, [512, True]]
  - [-6, 6, C2f_Faster, [512, True]]
  # C/4 ASSA alignment (H4, static DW3, no FFN), then original LAF (R4/D2).
  - [[13, 14], 1, ASSALAFMergeFeedback2D, [512, 4, 4, 3, 0.1, 2, 8]]

  - [-5, 1, Conv, [1024, 3, 2]]
  - [-6, 1, Conv, [1024, 3, 2]]
  - [-5, 3, C2f, [1024, True]]
  - [-5, 1, SPPF, [1024, 5]]
  - [-6, 3, C2f_Faster, [1024, True]]
  - [-6, 1, SPPF, [1024, 5]]
  - [[19, 21], 1, LAFMergeFeedback2D, [1024, 8, 4, 2, 8]]

head:
  # Refine only fused P3/P4 lateral features; both branches start as identity.
  - [10, 1, ZeroInitResidualRefine2D, [256, 0.25]]
  - [15, 1, ZeroInitResidualRefine2D, [512, 0.25]]
  - [22, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 24], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 23], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 27], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 22], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]
  - [[30, 33, 36], 1, OBB, [nc, 1]]
