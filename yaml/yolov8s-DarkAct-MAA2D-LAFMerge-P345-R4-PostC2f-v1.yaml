#
# 来源与改造说明：
# 本文件是 yolov8s-DarkAct-MAA2D-LAFMerge-P345-R4-v2.yaml 的新增消融变体，
# 不修改原 YAML 及 StaticMAA2D/LAFMergeFeedback2D 原有行为。
# 它将 P3/P4 的 StaticMAA2D 从 C2f 前移到两流 C2f/C2f_Faster 之后；
# P5 模仿 yolov8s-ASSAFusion.yaml，等两流 C2f + SPPF 都完成后再做 MAA。
# 目的是检验 StaticMAA2D 空间显著性不明显是否由后续 C2f 冲淡造成。

nc: 5
scales:
  # n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]
scale: s

backbone:
  # RGB/IR stems to P3/8.
  - [-5, 1, Conv, [64, 3, 2]]                              # 0 RGB-P1/2
  - [-5, 1, Conv, [128, 3, 2]]                             # 1 RGB-P2/4
  - [-5, 3, C2f, [128, True]]                              # 2
  - [-5, 1, Conv, [256, 3, 2]]                             # 3 RGB-P3/8
  - [-6, 1, Conv, [64, 3, 2]]                              # 4 IR-P1/2
  - [-6, 1, Conv, [128, 3, 2]]                             # 5 IR-P2/4
  - [-6, 3, C2f_Faster, [128, True]]                       # 6
  - [-6, 1, Conv, [256, 3, 2]]                             # 7 IR-P3/8

  # P3: per-stream extraction -> StaticMAA2D -> LAF feedback.
  - [-5, 6, C2f, [256, True]]                              # 8 RGB-P3
  - [-6, 6, C2f_Faster, [256, True]]                       # 9 IR-P3
  - [-3, 1, StaticMAA2D, [256, 4, 1, 0.01, [3, 5], 3]]    # 10 MAA pair
  - [10, 1, LAFMergeFeedback2D, [256, 2, 4, 1, 8]]        # 11 P3 fused/feedback

  - [-5, 1, Conv, [512, 3, 2]]                             # 12 RGB-P4/16
  - [-6, 1, Conv, [512, 3, 2]]                             # 13 IR-P4/16
  - [-5, 6, C2f, [512, True]]                              # 14 RGB-P4
  - [-6, 6, C2f_Faster, [512, True]]                       # 15 IR-P4
  - [-3, 1, StaticMAA2D, [512, 4, 2, 0.01, [3, 5], 3]]    # 16 MAA pair
  - [16, 1, LAFMergeFeedback2D, [512, 4, 4, 2, 8]]        # 17 P4 fused/feedback

  - [-5, 1, Conv, [1024, 3, 2]]                            # 18 RGB-P5/32
  - [-6, 1, Conv, [1024, 3, 2]]                            # 19 IR-P5/32
  - [-5, 3, C2f, [1024, True]]                             # 20 RGB-P5
  - [-5, 1, SPPF, [1024, 5]]                              # 21 RGB terminal
  - [-6, 3, C2f_Faster, [1024, True]]                      # 22 IR-P5
  - [-6, 1, SPPF, [1024, 5]]                              # 23 IR terminal
  - [-3, 1, StaticMAA2D, [1024, 4, 2, 0.01, [3, 5], 3]]   # 24 MAA pair
  - [24, 1, LAFMergeFeedback2D, [1024, 8, 4, 2, 8]]       # 25 P5 fused/feedback

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]            # 26
  - [[-1, 17], 1, Concat, [1]]                             # 27 P5 up + P4 fused
  - [-1, 3, C2f, [512]]                                    # 28
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]            # 29
  - [[-1, 11], 1, Concat, [1]]                             # 30 P4 up + P3 fused
  - [-1, 3, C2f, [256]]                                    # 31 P3/8
  - [-1, 1, Conv, [256, 3, 2]]                             # 32
  - [[-1, 28], 1, Concat, [1]]                             # 33
  - [-1, 3, C2f, [512]]                                    # 34 P4/16
  - [-1, 1, Conv, [512, 3, 2]]                             # 35
  - [[-1, 25], 1, Concat, [1]]                             # 36
  - [-1, 3, C2f, [1024]]                                   # 37 P5/32
  - [[31, 34, 37], 1, OBB, [nc, 1]]                        # 38
