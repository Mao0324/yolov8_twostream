# Ultralytics YOLO 🚀，AGPL-3.0 许可证
#
# 本架构将 CR-former 的 FT-Attention 迁移到 RGB/红外 DroneVehicle OBB 检测任务。
# 本文件以 yaml/baseline.yaml 为母版新建，不修改 baseline 和任何已有 ASSAFusion 架构。
# 仅将 P3 的 ADD 融合替换为部分通道双向 FTCrossMerge，P4/P5 仍保持 baseline ADD。

nc: 5
scales:
  # [深度系数, 宽度系数, 最大通道数]
  # n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]
scale: s

backbone:
  # RGB 分支：从输入逐步下采样到 P3/8。
  - [-1, 1, Conv, [64, 3, 2]]                         # 0 RGB-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                        # 1 RGB-P2/4
  - [-1, 3, C2f, [128, True]]                         # 2
  - [-1, 1, Conv, [256, 3, 2]]                        # 3 RGB-P3/8

  # 红外分支：从输入逐步下采样到 P3/8。
  - [-4, 1, Conv, [64, 3, 2]]                         # 4 IR-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                        # 5 IR-P2/4
  - [-1, 3, C2f_Faster, [128, True]]                  # 6
  - [-1, 1, Conv, [256, 3, 2]]                        # 7 IR-P3/8

  # 在双分支 P3 特征提取前保留 baseline 的恒等双流传递层。
  - [-3, 1, RIFusion, [64]]                           # 8

  # RGB/红外分别提取 P3 特征；imgsz=640、scale=s 时实际尺寸为 80×80、C=128。
  - [-4, 6, C2f, [256, True]]                         # 9 RGB-P3
  - [-1, 1, Conv, [512, 3, 2]]                        # 10 RGB-P4/16
  - [-4, 6, C2f_Faster, [256, True]]                  # 11 IR-P3
  - [-1, 1, Conv, [512, 3, 2]]                        # 12 IR-P4/16

  - [-3, 1, RIFusion, [128]]                          # 13

  # RGB/红外分别提取 P4 特征。
  - [-4, 6, C2f, [512, True]]                         # 14 RGB-P4
  - [-1, 1, Conv, [1024, 3, 2]]                       # 15 RGB-P5/32
  - [-4, 6, C2f_Faster, [512, True]]                  # 16 IR-P4
  - [-1, 1, Conv, [1024, 3, 2]]                       # 17 IR-P5/32

  - [-3, 1, RIFusion, [256]]                          # 18

  # RGB/红外分别完成 P5 末端语义特征提取。
  - [-4, 3, C2f, [1024, True]]                        # 19 RGB-P5
  - [-1, 1, SPPF, [1024, 5]]                          # 20
  - [-4, 3, C2f_Faster, [1024, True]]                 # 21 IR-P5
  - [-1, 1, SPPF, [1024, 5]]                          # 22

  # P3 FT 跨模态融合：
  # [注意力头数=2, 通道压缩比=4, 聚焦指数=2, 残差系数初值=0.0]。
  # Q/K/V 由全部 C 个输入通道经可学习 1×1 卷积映射到 C/4，不直接截取前 C/4 通道。
  # 残差系数初始为 0，因此初始输出严格等价于原 baseline 的 RGB + IR ADD。
  - [[9, 11], 1, FTCrossMerge, [2, 4, 2, 0.0]]        # 23 P3

  # P4/P5 不使用 FT-Attention，保持 baseline 的固定相加。
  - [[14, 16], 1, ADD, [1]]                           # 24 P4
  - [[20, 22], 1, ADD, [1]]                           # 25 P5

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 26
  - [[-1, 24], 1, Concat, [1]]                        # 27
  - [-1, 3, C2f, [512]]                               # 28

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 29
  - [[-1, 23], 1, Concat, [1]]                        # 30
  - [-1, 3, C2f, [256]]                               # 31 P3/8

  - [-1, 1, Conv, [256, 3, 2]]                        # 32
  - [[-1, 28], 1, Concat, [1]]                        # 33
  - [-1, 3, C2f, [512]]                               # 34 P4/16

  - [-1, 1, Conv, [512, 3, 2]]                        # 35
  - [[-1, 25], 1, Concat, [1]]                        # 36
  - [-1, 3, C2f, [1024]]                              # 37 P5/32

  - [[31, 34, 37], 1, OBB, [nc, 1]]                  # 38
