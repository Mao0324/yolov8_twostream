#
# 来源与改造说明：
# 本文件是 yolov8s-DarkAct-MAA2D-LAFMerge-P345-R4-v2.yaml 的新增精炼消融变体，
# 不修改原 YAML 及原有模块类。P3/P4 在两流 C2f/C2f_Faster 后做 StaticMAA2D，
# P5 在两流 C2f + SPPF 后做 StaticMAA2D，再分别精炼 RGB/IR：
#   Y_m -> 1x1(C -> C/4) -> 3x3(C/4 -> C) -> gamma * residual + Y_m
# RGB/IR 使用两个独立 ZeroInitResidualRefine2D 实例。gamma=0 保证初始 Z_m=Y_m。

nc: 5
scales:
  # n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]
scale: s

backbone:
  - [-5, 1, Conv, [64, 3, 2]]                              # 0 RGB-P1/2
  - [-5, 1, Conv, [128, 3, 2]]                             # 1 RGB-P2/4
  - [-5, 3, C2f, [128, True]]                              # 2
  - [-5, 1, Conv, [256, 3, 2]]                             # 3 RGB-P3/8
  - [-6, 1, Conv, [64, 3, 2]]                              # 4 IR-P1/2
  - [-6, 1, Conv, [128, 3, 2]]                             # 5 IR-P2/4
  - [-6, 3, C2f_Faster, [128, True]]                       # 6
  - [-6, 1, Conv, [256, 3, 2]]                             # 7 IR-P3/8

  # P3: C2f -> MAA -> independent zero-init refine -> LAF.
  - [-5, 6, C2f, [256, True]]                              # 8 RGB-P3
  - [-6, 6, C2f_Faster, [256, True]]                       # 9 IR-P3
  - [-3, 1, StaticMAA2D, [256, 4, 1, 0.01, [3, 5], 3]]    # 10 MAA pair
  - [-5, 1, ZeroInitResidualRefine2D, [256, 0.25]]         # 11 RGB refine
  - [-6, 1, ZeroInitResidualRefine2D, [256, 0.25]]         # 12 IR refine
  - [[11, 12], 1, LAFMergeFeedback2D, [256, 2, 4, 1, 8]]  # 13 P3 fused/feedback

  - [-5, 1, Conv, [512, 3, 2]]                             # 14 RGB-P4/16
  - [-6, 1, Conv, [512, 3, 2]]                             # 15 IR-P4/16
  - [-5, 6, C2f, [512, True]]                              # 16 RGB-P4
  - [-6, 6, C2f_Faster, [512, True]]                       # 17 IR-P4
  - [-3, 1, StaticMAA2D, [512, 4, 2, 0.01, [3, 5], 3]]    # 18 MAA pair
  - [-5, 1, ZeroInitResidualRefine2D, [512, 0.25]]         # 19 RGB refine
  - [-6, 1, ZeroInitResidualRefine2D, [512, 0.25]]         # 20 IR refine
  - [[19, 20], 1, LAFMergeFeedback2D, [512, 4, 4, 2, 8]]  # 21 P4 fused/feedback

  - [-5, 1, Conv, [1024, 3, 2]]                            # 22 RGB-P5/32
  - [-6, 1, Conv, [1024, 3, 2]]                            # 23 IR-P5/32
  - [-5, 3, C2f, [1024, True]]                             # 24 RGB-P5
  - [-5, 1, SPPF, [1024, 5]]                              # 25 RGB terminal
  - [-6, 3, C2f_Faster, [1024, True]]                      # 26 IR-P5
  - [-6, 1, SPPF, [1024, 5]]                              # 27 IR terminal
  - [-3, 1, StaticMAA2D, [1024, 4, 2, 0.01, [3, 5], 3]]   # 28 MAA pair
  - [-5, 1, ZeroInitResidualRefine2D, [1024, 0.25]]        # 29 RGB refine
  - [-6, 1, ZeroInitResidualRefine2D, [1024, 0.25]]        # 30 IR refine
  - [[29, 30], 1, LAFMergeFeedback2D, [1024, 8, 4, 2, 8]] # 31 P5 fused/feedback

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]            # 32
  - [[-1, 21], 1, Concat, [1]]                             # 33 P5 up + P4 fused
  - [-1, 3, C2f, [512]]                                    # 34
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]            # 35
  - [[-1, 13], 1, Concat, [1]]                             # 36 P4 up + P3 fused
  - [-1, 3, C2f, [256]]                                    # 37 P3/8
  - [-1, 1, Conv, [256, 3, 2]]                             # 38
  - [[-1, 34], 1, Concat, [1]]                             # 39
  - [-1, 3, C2f, [512]]                                    # 40 P4/16
  - [-1, 1, Conv, [512, 3, 2]]                             # 41
  - [[-1, 31], 1, Concat, [1]]                             # 42
  - [-1, 3, C2f, [1024]]                                   # 43 P5/32
  - [[37, 40, 43], 1, OBB, [nc, 1]]                        # 44
