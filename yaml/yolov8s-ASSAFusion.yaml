# Ultralytics YOLO 🚀, AGPL-3.0 license
# RGB-IR YOLOv8s with bidirectional ASSA fusion at P3/P4/P5.

nc: 5
scales:
  #n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]
scale: s

backbone:
  # Stem to P3/8.
  - [-1, 1, Conv, [64, 3, 2]]             # 0 RGB-P1/2
  - [-1, 1, Conv, [128, 3, 2]]            # 1 RGB-P2/4
  - [-1, 3, C2f, [128, True]]             # 2
  - [-1, 1, Conv, [256, 3, 2]]            # 3 RGB-P3/8
  - [-4, 1, Conv, [64, 3, 2]]             # 4 IR-P1/2
  - [-1, 1, Conv, [128, 3, 2]]            # 5 IR-P2/4
  - [-1, 3, C2f_Faster, [128, True]]      # 6
  - [-1, 1, Conv, [256, 3, 2]]            # 7 IR-P3/8

  # P3 interaction after per-stream extraction, immediately before P4 downsampling.
  - [-1, 6, C2f_Faster, [256, True]]      # 8 IR-P3
  - [-4, 6, C2f, [256, True]]             # 9 RGB-P3
  - [-3, 1, ASSAFusion, [256, 2]]         # 10 P3, C=128 for scale s
  - [-1, 1, Conv, [512, 3, 2]]            # 11 RGB-P4/16
  - [-1, 6, C2f, [512, True]]             # 12 RGB-P4

  # P4 interaction after per-stream extraction, immediately before P5 downsampling.
  - [-4, 1, Conv, [512, 3, 2]]            # 13 IR-P4/16
  - [-1, 6, C2f_Faster, [512, True]]      # 14 IR-P4
  - [-3, 1, ASSAFusion, [512, 4]]         # 15 P4, C=256 for scale s
  - [-1, 1, Conv, [1024, 3, 2]]           # 16 IR-P5/32
  - [-1, 3, C2f_Faster, [1024, True]]     # 17 IR-P5
  - [-1, 1, SPPF, [1024, 5]]              # 18

  # P5 has no further backbone downsampling; fuse after terminal semantic extraction.
  - [-4, 1, Conv, [1024, 3, 2]]           # 19 RGB-P5/32
  - [-1, 3, C2f, [1024, True]]            # 20 RGB-P5
  - [-1, 1, SPPF, [1024, 5]]              # 21
  - [-3, 1, ASSAFusion, [1024, 8]]        # 22 P5, C=512 for scale s

  # Merge the already-interacted modality pair only when entering the shared neck.
  - [10, 1, ADD, [1]]                     # 23 P3
  - [15, 1, ADD, [1]]                     # 24 P4
  - [22, 1, ADD, [1]]                     # 25 P5

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 26
  - [[-1, 24], 1, Concat, [1]]                   # 27
  - [-1, 3, C2f, [512]]                          # 28
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 29
  - [[-1, 23], 1, Concat, [1]]                   # 30
  - [-1, 3, C2f, [256]]                          # 31 P3/8
  - [-1, 1, Conv, [256, 3, 2]]                   # 32
  - [[-1, 28], 1, Concat, [1]]                   # 33
  - [-1, 3, C2f, [512]]                          # 34 P4/16
  - [-1, 1, Conv, [512, 3, 2]]                   # 35
  - [[-1, 25], 1, Concat, [1]]                   # 36
  - [-1, 3, C2f, [1024]]                         # 37 P5/32
  - [[31, 34, 37], 1, OBB, [nc, 1]]              # 38
