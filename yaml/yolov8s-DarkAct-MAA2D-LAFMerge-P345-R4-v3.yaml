# 来源与改造说明：
# 本架构以 yolov8s-DarkAct-MAA2D-LAFMerge-P345-R4-v2.yaml 为母版，新增
# PaperLAFMergeFeedback2D，完整实现 DarkAct 论文公式 (4)-(8) 的单帧二维迁移。
# V1/V2 的 MAA2D、LAFMerge2D、StaticMAA2D、LAFMergeFeedback2D 及其 YAML
# 均保持原来的模块名、结构和语义，本文件是独立的 V3 实验分支。
#
# StaticMAA2D（P3/P4/P5）：
#   继续使用 V2 的静态论文式 MAA。每个尺度都显式保存输出 (Y_rgb, Y_ir)，
#   同时两条流继续经过各自的 C2f/C2f_Faster，产生 stage 特征 (F_rgb, F_ir)。
#
# PaperLAFMergeFeedback2D（P3/P4/P5）：
#   1. F_Q = phi([Y_rgb * F_rgb; Y_ir * F_ir])，得到共享 Light-Adaptive Query；
#   2. RGB/IR 分别经完整 C 维 Dilated Conv3x3 + PReLU + BN + Sigmoid 得到 Key；
#   3. Att(F_rgb,F_rgb,F_ir) 与 Att(F_ir,F_ir,F_rgb) 生成双向交叉特征；
#   4. 双向特征拼接后，经局部 AP3/MP3（stride=1）和 1x1 MLP 得到共享 F_V；
#   5. 共享 F_Q、模态专属 F_K、共享 F_V 生成两个完整 C 维动态注意力结果；
#   6. 两个结果分别经过独立 MLP 后相加，得到共享残差 F_LAF；
#   7. 后续两条流分别为 F_rgb+F_LAF、F_ir+F_LAF，neck 使用
#      F_rgb+F_ir+F_LAF。输出 MLP 零初始化，因此初始时严格等价于原 ADD。
# 注意：论文注意力按 CxN 计算，本实现不分头、不做 C/4 通道裁剪，因此 Heads=HNA。

nc: 5
scales:
  # n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]
scale: s

backbone:
  # RGB 分支：提取至 P3/8。
  - [-5, 1, Conv, [64, 3, 2]]                              # 0 RGB-P1/2
  - [-5, 1, Conv, [128, 3, 2]]                             # 1 RGB-P2/4
  - [-5, 3, C2f, [128, True]]                              # 2
  - [-5, 1, Conv, [256, 3, 2]]                             # 3 RGB-P3/8

  # IR 分支：提取至 P3/8。
  - [-6, 1, Conv, [64, 3, 2]]                              # 4 IR-P1/2
  - [-6, 1, Conv, [128, 3, 2]]                             # 5
  - [-6, 3, C2f_Faster, [128, True]]                       # 6
  - [-6, 1, Conv, [256, 3, 2]]                             # 7 IR-P3/8

  # P3：保存 StaticMAA2D 的 Y 对，并与 stage F 对一起显式输入 Paper LAF。
  - [-3, 1, StaticMAA2D, [256, 4, 1, 0.01, [3, 5], 3]]    # 8 (Y_rgb, Y_ir)
  - [-5, 6, C2f, [256, True]]                              # 9 F_rgb P3
  - [-6, 6, C2f_Faster, [256, True]]                       # 10 F_ir P3
  # 参数：[未缩放通道数, key dilation, AP/MP kernel]
  - [[8, 9, 10], 1, PaperLAFMergeFeedback2D, [256, 1, 3]] # 11 P3 fused/feedback

  - [-5, 1, Conv, [512, 3, 2]]                             # 12 RGB-P4/16
  - [-6, 1, Conv, [512, 3, 2]]                             # 13 IR-P4/16

  # P4：Key 使用 dilation=2，仍在完整 C 维计算注意力。
  - [-3, 1, StaticMAA2D, [512, 4, 2, 0.01, [3, 5], 3]]    # 14 (Y_rgb, Y_ir)
  - [-5, 6, C2f, [512, True]]                              # 15 F_rgb P4
  - [-6, 6, C2f_Faster, [512, True]]                       # 16 F_ir P4
  - [[14, 15, 16], 1, PaperLAFMergeFeedback2D, [512, 2, 3]] # 17 P4 fused/feedback

  - [-5, 1, Conv, [1024, 3, 2]]                            # 18 RGB-P5/32
  - [-6, 1, Conv, [1024, 3, 2]]                            # 19 IR-P5/32

  # P5：保留显式 Y/F 输入，融合结果作为 neck 的 P5 特征。
  - [-3, 1, StaticMAA2D, [1024, 4, 2, 0.01, [3, 5], 3]]   # 20 (Y_rgb, Y_ir)
  - [-5, 3, C2f, [1024, True]]                             # 21
  - [-5, 1, SPPF, [1024, 5]]                              # 22 F_rgb P5
  - [-6, 3, C2f_Faster, [1024, True]]                      # 23
  - [-6, 1, SPPF, [1024, 5]]                              # 24 F_ir P5
  - [[20, 22, 24], 1, PaperLAFMergeFeedback2D, [1024, 2, 3]] # 25 P5 fused

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]           # 26
  - [[-1, 17], 1, Concat, [1]]                            # 27 P5 up + P4 fused
  - [-1, 3, C2f, [512]]                                   # 28
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]           # 29
  - [[-1, 11], 1, Concat, [1]]                            # 30 P4 up + P3 fused
  - [-1, 3, C2f, [256]]                                   # 31 P3/8
  - [-1, 1, Conv, [256, 3, 2]]                            # 32
  - [[-1, 28], 1, Concat, [1]]                            # 33
  - [-1, 3, C2f, [512]]                                   # 34 P4/16
  - [-1, 1, Conv, [512, 3, 2]]                            # 35
  - [[-1, 25], 1, Concat, [1]]                            # 36
  - [-1, 3, C2f, [1024]]                                  # 37 P5/32
  - [[31, 34, 37], 1, OBB, [nc, 1]]                       # 38
