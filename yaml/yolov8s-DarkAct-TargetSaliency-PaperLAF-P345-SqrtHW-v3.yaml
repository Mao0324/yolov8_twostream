#
# 父实验：yolov8s-DarkAct-TargetSaliency-PaperLAF-P345-FP32Safe-v2.yaml
# 唯一改动：目标显著性通道注意力由 sqrt(active_channels) 改为 sqrt(H*W) 缩放。
# 仍然在 FP32 中计算 matmul/softmax，仍然是 C_a x C_a 通道注意力。

nc: 5
target_saliency_loss_gain: 0.05
target_saliency_stage_weights: [1.0, 1.0, 1.0]
target_saliency_mask_tolerance: 0.5

scales:
  s: [0.33, 0.50, 1024]
scale: s

backbone:
  - [-5, 1, Conv, [64, 3, 2]]
  - [-5, 1, Conv, [128, 3, 2]]
  - [-5, 3, C2f, [128, True]]
  - [-5, 1, Conv, [256, 3, 2]]
  - [-6, 1, Conv, [64, 3, 2]]
  - [-6, 1, Conv, [128, 3, 2]]
  - [-6, 3, C2f_Faster, [128, True]]
  - [-6, 1, Conv, [256, 3, 2]]

  # P3
  - [-5, 6, C2f, [256, True]]
  - [-6, 6, C2f_Faster, [256, True]]
  - [[8, 9], 1, StaticMAAContext2DSqrtHW, [256, 4, 1, [3, 5], 3]]
  - [[10, 8, 9], 1, TargetSaliencyPaperLAFMergeFeedback2D, [256, 1, 3]]

  # P4
  - [-5, 1, Conv, [512, 3, 2]]
  - [-6, 1, Conv, [512, 3, 2]]
  - [-5, 6, C2f, [512, True]]
  - [-6, 6, C2f_Faster, [512, True]]
  - [[14, 15], 1, StaticMAAContext2DSqrtHW, [512, 4, 2, [3, 5], 3]]
  - [[16, 14, 15], 1, TargetSaliencyPaperLAFMergeFeedback2D, [512, 2, 3]]

  # P5
  - [-5, 1, Conv, [1024, 3, 2]]
  - [-6, 1, Conv, [1024, 3, 2]]
  - [-5, 3, C2f, [1024, True]]
  - [-5, 1, SPPF, [1024, 5]]
  - [-6, 3, C2f_Faster, [1024, True]]
  - [-6, 1, SPPF, [1024, 5]]
  - [[21, 23], 1, StaticMAAContext2DSqrtHW, [1024, 4, 2, [3, 5], 3]]
  - [[24, 21, 23], 1, TargetSaliencyPaperLAFMergeFeedback2D, [1024, 2, 3]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 17], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 28], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 25], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]
  - [[31, 34, 37], 1, OBB, [nc, 1]]
