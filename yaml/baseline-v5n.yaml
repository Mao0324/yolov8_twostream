# Ultralytics YOLO
# Two-stream YOLOv5-style OBB baseline
# RGB + IR + RIFusion + ADD

nc: 5

scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 1024]
  l: [1.00, 1.00, 1024]
  x: [1.33, 1.25, 1024]

scale: n


# =========================
# Backbone
# =========================
backbone:

  # -------- RGB --------
  - [-1, 1, Conv, [64, 6, 2, 2]]      # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]        # 1  P2/4
  - [-1, 3, C3, [128]]                # 2
  - [-1, 1, Conv, [256, 3, 2]]        # 3  P3/8

  # -------- IR --------
  - [-4, 1, Conv, [64, 6, 2, 2]]      # 4  P1/2
  - [-1, 1, Conv, [128, 3, 2]]        # 5  P2/4
  - [-1, 3, C3, [128]]                # 6
  - [-1, 1, Conv, [256, 3, 2]]        # 7  P3/8

  # -------- Fusion P3 --------
  - [-3, 1, RIFusion, [64]]            # 8

  # -------- RGB --------
  - [-4, 6, C3, [256]]                 # 9  P3
  - [-1, 1, Conv, [512, 3, 2]]        # 10 P4/16

  # -------- IR --------
  - [-4, 6, C3, [256]]                 # 11 P3
  - [-1, 1, Conv, [512, 3, 2]]        # 12 P4/16

  # -------- Fusion P4 --------
  - [-3, 1, RIFusion, [128]]           # 13

  # -------- RGB --------
  - [-4, 9, C3, [512]]                 # 14 P4
  - [-1, 1, Conv, [1024, 3, 2]]       # 15 P5/32

  # -------- IR --------
  - [-4, 9, C3, [512]]                 # 16 P4
  - [-1, 1, Conv, [1024, 3, 2]]       # 17 P5/32

  # -------- Fusion P5 --------
  - [-3, 1, RIFusion, [256]]           # 18

  # -------- RGB --------
  - [-4, 3, C3, [1024]]                # 19
  - [-1, 1, SPPF, [1024, 5]]          # 20

  # -------- IR --------
  - [-4, 3, C3, [1024]]                # 21
  - [-1, 1, SPPF, [1024, 5]]          # 22


  # -------- RGB + IR --------
  - [[9, 11], 1, ADD, [1]]             # 23 P3
  - [[14, 16], 1, ADD, [1]]            # 24 P4
  - [[20, 22], 1, ADD, [1]]            # 25 P5


# =========================
# YOLOv5-style PAN-FPN
# =========================
head:

  # P5 -> P4
  - [-1, 1, Conv, [512, 1, 1]]         # 26
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 27
  - [[-1, 24], 1, Concat, [1]]         # 28
  - [-1, 3, C3, [512, False]]          # 29

  # P4 -> P3
  - [-1, 1, Conv, [256, 1, 1]]         # 30
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 31
  - [[-1, 23], 1, Concat, [1]]         # 32
  - [-1, 3, C3, [256, False]]          # 33 P3/8

  # P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]]         # 34
  - [[-1, 30], 1, Concat, [1]]         # 35
  - [-1, 3, C3, [512, False]]          # 36 P4/16

  # P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]]         # 37
  - [[-1, 26], 1, Concat, [1]]         # 38
  - [-1, 3, C3, [1024, False]]         # 39 P5/32

  # OBB Head
  - [[33, 36, 39], 1, OBB, [nc, 1]]   # 40