#
# 实验 ID：DA-013
# 父实验：DA-002
#
# 唯一结构改动：保留 P3/P4/P5 Static MAA 的位置、容量和 LAF 反馈结构，
# 将增强-only 门控
#     1 + beta * sigmoid(logit)
# 改为零中心、可增强也可抑制的门控
#     1 + beta * tanh(logit)。
#
# beta 通过 beta_max * sigmoid(raw_beta) 保持为正并限制幅度；本实验设置
# beta_init=0.10、beta_max=0.50，因此乘法因子始终位于 [0.5, 1.5]。
# 两个模态分支的输出投影采用零初始化，模型迁移起点是严格恒等映射。

nc: 5
scales:
  s: [0.33, 0.50, 1024]
scale: s

backbone:
  - [-5, 1, Conv, [64, 3, 2]]                                  # 0 RGB-P1/2
  - [-5, 1, Conv, [128, 3, 2]]                                 # 1 RGB-P2/4
  - [-5, 3, C2f, [128, True]]                                  # 2
  - [-5, 1, Conv, [256, 3, 2]]                                 # 3 RGB-P3/8
  - [-6, 1, Conv, [64, 3, 2]]                                  # 4 IR-P1/2
  - [-6, 1, Conv, [128, 3, 2]]                                 # 5 IR-P2/4
  - [-6, 3, C2f_Faster, [128, True]]                           # 6
  - [-6, 1, Conv, [256, 3, 2]]                                 # 7 IR-P3/8

  # 参数：[通道, partial_ratio, dilation, beta_init, beta_max, K3/K5, query_kernel]
  - [-3, 1, ZeroCenteredStaticMAA2D, [256, 4, 1, 0.10, 0.50, [3, 5], 3]]   # 8
  - [-5, 6, C2f, [256, True]]                                  # 9 RGB-P3
  - [-6, 6, C2f_Faster, [256, True]]                           # 10 IR-P3
  - [[9, 10], 1, LAFMergeFeedback2D, [256, 2, 4, 1, 8]]       # 11 P3 fused

  - [-5, 1, Conv, [512, 3, 2]]                                 # 12 RGB-P4/16
  - [-6, 1, Conv, [512, 3, 2]]                                 # 13 IR-P4/16
  - [-3, 1, ZeroCenteredStaticMAA2D, [512, 4, 2, 0.10, 0.50, [3, 5], 3]]   # 14
  - [-5, 6, C2f, [512, True]]                                  # 15 RGB-P4
  - [-6, 6, C2f_Faster, [512, True]]                           # 16 IR-P4
  - [[15, 16], 1, LAFMergeFeedback2D, [512, 4, 4, 2, 8]]      # 17 P4 fused

  - [-5, 1, Conv, [1024, 3, 2]]                                # 18 RGB-P5/32
  - [-6, 1, Conv, [1024, 3, 2]]                                # 19 IR-P5/32
  - [-3, 1, ZeroCenteredStaticMAA2D, [1024, 4, 2, 0.10, 0.50, [3, 5], 3]]  # 20
  - [-5, 3, C2f, [1024, True]]                                 # 21 RGB-P5
  - [-5, 1, SPPF, [1024, 5]]                                  # 22
  - [-6, 3, C2f_Faster, [1024, True]]                          # 23 IR-P5
  - [-6, 1, SPPF, [1024, 5]]                                  # 24
  - [[22, 24], 1, LAFMergeFeedback2D, [1024, 8, 4, 2, 8]]     # 25 P5 fused

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]                # 26
  - [[-1, 17], 1, Concat, [1]]                                # 27
  - [-1, 3, C2f, [512]]                                       # 28
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]                # 29
  - [[-1, 11], 1, Concat, [1]]                                # 30
  - [-1, 3, C2f, [256]]                                       # 31 P3/8
  - [-1, 1, Conv, [256, 3, 2]]                                # 32
  - [[-1, 28], 1, Concat, [1]]                                # 33
  - [-1, 3, C2f, [512]]                                       # 34 P4/16
  - [-1, 1, Conv, [512, 3, 2]]                                # 35
  - [[-1, 25], 1, Concat, [1]]                                # 36
  - [-1, 3, C2f, [1024]]                                      # 37 P5/32
  - [[31, 34, 37], 1, OBB, [nc, 1]]                           # 38
