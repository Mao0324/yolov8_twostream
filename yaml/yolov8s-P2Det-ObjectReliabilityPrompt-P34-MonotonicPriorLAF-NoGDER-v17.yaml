# P2D-017: true per-object RGB/IR detection reliability at P3/P4.
# Teachers and q/topk semantics are unchanged from V16. Every GT contributes
# one size-normalized loss, RGB/IR teacher winners are balanced, and Prompt
# probabilities enter each gate through a positive log-prior with no learned
# cross-modal sign or bias. P5 remains DarkACT LAF; no GDER is introduced.

nc: 5
scales:
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]
scale: s

p2_object_reliability_stages: [P3, P4]
p2_object_reliability_stage_weights: [1.0, 0.5]
p2_object_reliability_gain: 0.05
p2_object_reliability_warmup_epochs: 10
p2_object_support_sigma: 0.7
p2_object_minimum_cells: 2.0
p2_object_reduce_chunk_size: 64
p2_object_calibration_ratio: 0.5
p2_object_balanced_ratio: 0.5
p2_object_rank_gain: 0.1
p2_object_rank_max_objects: 128
p2_object_rank_min_gap: 0.1
p2_object_confidence_floor: 0.25
p2_object_gate_direction_stage_gains: [0.2, 0.1]
p2_object_gate_direction_min_margin: 0.1
p2_object_gate_direction_scale: 4.0
p2_object_cross_scale_consistency_gain: 0.05
p2_teacher_temperature: 0.2
p2_teacher_match_topk: 128

backbone:
  # RGB branch to P3/8.
  - [-5, 1, Conv, [64, 3, 2]]
  - [-5, 1, Conv, [128, 3, 2]]
  - [-5, 3, C2f, [128, True]]
  - [-5, 1, Conv, [256, 3, 2]]

  # IR branch to P3/8.
  - [-6, 1, Conv, [64, 3, 2]]
  - [-6, 1, Conv, [128, 3, 2]]
  - [-6, 3, C2f_Faster, [128, True]]
  - [-6, 1, Conv, [256, 3, 2]]

  - [-5, 6, C2f, [256, True]]
  - [-6, 6, C2f_Faster, [256, True]]
  - [[8, 9], 1, P2DualObjectReliabilityMonotonicLAFMergeFeedback2D, [256, 2, 4, 1, 8]] # P3

  - [-5, 1, Conv, [512, 3, 2]]
  - [-6, 1, Conv, [512, 3, 2]]
  - [-5, 6, C2f, [512, True]]
  - [-6, 6, C2f_Faster, [512, True]]
  - [[13, 14], 1, P2DualObjectReliabilityMonotonicLAFMergeFeedback2D, [512, 4, 4, 2, 8]] # P4

  - [-5, 1, Conv, [1024, 3, 2]]
  - [-6, 1, Conv, [1024, 3, 2]]
  - [-5, 3, C2f, [1024, True]]
  - [-5, 1, SPPF, [1024, 5]]
  - [-6, 3, C2f_Faster, [1024, True]]
  - [-6, 1, SPPF, [1024, 5]]
  - [[19, 21], 1, LAFMergeFeedback2D, [1024, 8, 4, 2, 8]] # P5 unchanged

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 15], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 25], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 22], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]
  - [[28, 31, 34], 1, OBB, [nc, 1]]
