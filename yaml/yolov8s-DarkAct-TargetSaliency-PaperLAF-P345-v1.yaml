# 来源与改造说明：
# 本文件以 yolov8s-DarkAct-MAA2D-LAFMerge-P345-R4-v3.yaml 为对照，
# 是新增的目标显著性分支，不修改旧类和旧 YAML。
#
# 每个尺度严格执行：
#   C2f/SPPF -> F
#   F -> StaticMAAContext2D -> 每模态一张单通道目标显著性 logit S
#   OBB mask -> BCE + Dice 辅助监督 S
#   F_Q = phi([sigmoid(S_rgb) * Norm(F_rgb); sigmoid(S_ir) * Norm(F_ir)])
#
# StaticMAAContext2D 直接从与 LAF 同尺度、同 stage 的 F 预测空间图，
# 因此不再假设前置 MAA 输出与后续 C2f 特征在 C 通道上语义对齐。
# TargetSaliencyPaperLAFMergeFeedback2D 保留 V3 的 full-C Key、双向 cross attention、
# 公共 Value、二次 dynamic attention 和零初始化融合残差。

