# 来源：基于 yaml/baseline.yaml 的 RGB/IR 双流 OBB 基线结构新建，原 baseline.yaml 保持不变。
# 改动：在 P3、P4、P5 三个尺度的 ADD 融合后，分别增加一个 Bottleneck 融合精炼块。
#       残差分支执行 1×1 通道降维（C→C/2）、3×3 空间建模并恢复通道（C/2→C），再与 ADD 输出跳连相加。
# 用途：在融合特征进入 FPN/PAN 之前做同尺度局部精炼，用于与原始 ADD 直连 FPN 基线进行消融对比。

# Ultralytics YOLOv8 RGB/IR two-stream OBB model with P3-P5 outputs

# 模型参数
nc: 5  # 类别数
scales:  # [depth, width, max_channels]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

scale: s

# RGB/IR 双流骨干网络
backbone:
  # [输入层, 重复次数, 模块, 参数]

  # RGB 分支：P1-P3
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4
  - [-1, 3, C2f, [128, True]]          # 2
  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8

  # IR 分支：P1-P3
  - [-4, 1, Conv, [64, 3, 2]]          # 4-P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 5-P2/4
  - [-1, 3, C2f_Faster, [128, True]]   # 6
  - [-1, 1, Conv, [256, 3, 2]]         # 7-P3/8

  # P2 中间融合
  - [-3, 1, RIFusion, [64]]            # 8

  # RGB 分支：P3-P4
  - [-4, 6, C2f, [256, True]]          # 9-P3/8
  - [-1, 1, Conv, [512, 3, 2]]         # 10-P4/16

  # IR 分支：P3-P4
  - [-4, 6, C2f_Faster, [256, True]]   # 11-P3/8
  - [-1, 1, Conv, [512, 3, 2]]         # 12-P4/16

  # P3 中间融合
  - [-3, 1, RIFusion, [128]]           # 13

  # RGB 分支：P4-P5
  - [-4, 6, C2f, [512, True]]          # 14-P4/16
  - [-1, 1, Conv, [1024, 3, 2]]        # 15-P5/32

  # IR 分支：P4-P5
  - [-4, 6, C2f_Faster, [512, True]]   # 16-P4/16
  - [-1, 1, Conv, [1024, 3, 2]]        # 17-P5/32

  # P4 中间融合
  - [-3, 1, RIFusion, [256]]           # 18

  # RGB 分支：P5 语义特征
  - [-4, 3, C2f, [1024, True]]         # 19-P5/32
  - [-1, 1, SPPF, [1024, 5]]           # 20

  # IR 分支：P5 语义特征
  - [-4, 3, C2f_Faster, [1024, True]]  # 21-P5/32
  - [-1, 1, SPPF, [1024, 5]]           # 22

  # P3 输出融合：ADD 后做 1×1 降维、3×3 恢复通道并残差相加
  - [[9, 11], 1, ADD, [1]]                                # 23-P3 ADD，输出 C
  - [-1, 1, Bottleneck, [256, True, 1, [1, 3], 0.5]]     # 24-P3：C→C/2→C，开启跳连

  # P4 输出融合：ADD 后做 1×1 降维、3×3 恢复通道并残差相加
  - [[14, 16], 1, ADD, [1]]                               # 25-P4 ADD，输出 C
  - [-1, 1, Bottleneck, [512, True, 1, [1, 3], 0.5]]     # 26-P4：C→C/2→C，开启跳连

  # P5 输出融合：ADD 后做 1×1 降维、3×3 恢复通道并残差相加
  - [[20, 22], 1, ADD, [1]]                               # 27-P5 ADD，输出 C
  - [-1, 1, Bottleneck, [1024, True, 1, [1, 3], 0.5]]    # 28-P5：C→C/2→C，开启跳连

# FPN/PAN 检测头：仅使用精炼后的 P3/P4/P5 特征
head:
  # FPN 自顶向下：P5 → P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 29
  - [[-1, 26], 1, Concat, [1]]                  # 30：拼接精炼后的 P4
  - [-1, 3, C2f, [512]]                         # 31-P4

  # FPN 自顶向下：P4 → P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 32
  - [[-1, 24], 1, Concat, [1]]                  # 33：拼接精炼后的 P3
  - [-1, 3, C2f, [256]]                         # 34-P3/8，小目标输出

  # PAN 自底向上：P3 → P4
  - [-1, 1, Conv, [256, 3, 2]]                  # 35
  - [[-1, 31], 1, Concat, [1]]                  # 36
  - [-1, 3, C2f, [512]]                         # 37-P4/16，中目标输出

  # PAN 自底向上：P4 → P5
  - [-1, 1, Conv, [512, 3, 2]]                  # 38
  - [[-1, 28], 1, Concat, [1]]                  # 39：拼接精炼后的 P5
  - [-1, 3, C2f, [1024]]                        # 40-P5/32，大目标输出

  # P3、P4、P5 三尺度旋转框检测头
  - [[34, 37, 40], 1, OBB, [nc, 1]]             # 41
