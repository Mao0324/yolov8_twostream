# DA-016-V5:
# YOLOv5-style backbone/neck
# + LAF-only
# + four-way semantic disagreement residual at P3/P4
#
# Relative to DA-016:
#   - YOLOv8 C2f backbone -> YOLOv5 C3 backbone
#   - IR C2f_Faster -> C3 for a clean YOLOv5 architecture
#   - first stem Conv 3x3 -> YOLOv5 Conv 6x6
#   - P4 stage repeats 6 -> 9
#   - YOLOv8 neck -> YOLOv5 PAN-FPN
#   - P3/P4 SemanticDisagreementLAFMergeFeedback2D unchanged
#   - P5 LAFMergeFeedback2D unchanged
#   - OBB head unchanged

nc: 5

scales:
  n: [0.33, 0.25, 1024]

scale: n


# ============================================================
# Backbone: YOLOv5-style two-stream RGB / IR
# ============================================================

backbone:

  # ----------------------------------------------------------
  # RGB branch: P1 -> P3
  # YOLOv5 stem uses 6x6 Conv
  # ----------------------------------------------------------

  - [-5, 1, Conv, [64, 6, 2, 2]]                          # 0 RGB-P1/2
  - [-5, 1, Conv, [128, 3, 2]]                            # 1 RGB-P2/4
  - [-5, 3, C3, [128]]                                    # 2
  - [-5, 1, Conv, [256, 3, 2]]                            # 3 RGB-P3/8


  # ----------------------------------------------------------
  # IR branch: P1 -> P3
  # Clean YOLOv5 version: C3 instead of C2f_Faster
  # ----------------------------------------------------------

  - [-6, 1, Conv, [64, 6, 2, 2]]                          # 4 IR-P1/2
  - [-6, 1, Conv, [128, 3, 2]]                            # 5 IR-P2/4
  - [-6, 3, C3, [128]]                                    # 6
  - [-6, 1, Conv, [256, 3, 2]]                            # 7 IR-P3/8


  # ==========================================================
  # P3
  # ==========================================================

  - [-5, 6, C3, [256]]                                    # 8 RGB-P3
  - [-6, 6, C3, [256]]                                    # 9 IR-P3

  - [[8, 9], 1, SemanticDisagreementLAFMergeFeedback2D,
     [256, 2, 4, 1, 8, 4]]                               # 10 P3 semantic fusion/feedback


  # ==========================================================
  # P4 downsampling
  # ==========================================================

  - [-5, 1, Conv, [512, 3, 2]]                            # 11 RGB-P4/16
  - [-6, 1, Conv, [512, 3, 2]]                            # 12 IR-P4/16


  # ==========================================================
  # P4
  #
  # YOLOv5 backbone uses 9 repeats here rather than YOLOv8's 6
  # ==========================================================

  - [-5, 9, C3, [512]]                                    # 13 RGB-P4
  - [-6, 9, C3, [512]]                                    # 14 IR-P4

  - [[13, 14], 1, SemanticDisagreementLAFMergeFeedback2D,
     [512, 4, 4, 2, 8, 4]]                               # 15 P4 semantic fusion/feedback


  # ==========================================================
  # P5 downsampling
  # ==========================================================

  - [-5, 1, Conv, [1024, 3, 2]]                           # 16 RGB-P5/32
  - [-6, 1, Conv, [1024, 3, 2]]                           # 17 IR-P5/32


  # ==========================================================
  # P5
  # ==========================================================

  - [-5, 3, C3, [1024]]                                   # 18 RGB-P5
  - [-5, 1, SPPF, [1024, 5]]                             # 19 RGB-SPPF

  - [-6, 3, C3, [1024]]                                   # 20 IR-P5
  - [-6, 1, SPPF, [1024, 5]]                             # 21 IR-SPPF

  - [[19, 21], 1, LAFMergeFeedback2D,
     [1024, 8, 4, 2, 8]]                                 # 22 P5 unchanged LAF


# ============================================================
# YOLOv5 PAN-FPN Neck + current OBB Head
# ============================================================

head:

  # ==========================================================
  # P5 -> P4
  #
  # Standard YOLOv5 adds a lateral 1x1 Conv before upsampling.
  # ==========================================================

  - [-1, 1, Conv, [512, 1, 1]]                            # 23 P5 lateral
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]           # 24
  - [[-1, 15], 1, Concat, [1]]                            # 25 P5-up + fused P4
  - [-1, 3, C3, [512, False]]                             # 26


  # ==========================================================
  # P4 -> P3
  # ==========================================================

  - [-1, 1, Conv, [256, 1, 1]]                            # 27 P4 lateral
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]           # 28
  - [[-1, 10], 1, Concat, [1]]                            # 29 P4-up + fused P3
  - [-1, 3, C3, [256, False]]                             # 30 P3/8


  # ==========================================================
  # PAN bottom-up: P3 -> P4
  # ==========================================================

  - [-1, 1, Conv, [256, 3, 2]]                            # 31
  - [[-1, 27], 1, Concat, [1]]                            # 32
  - [-1, 3, C3, [512, False]]                             # 33 P4/16


  # ==========================================================
  # PAN bottom-up: P4 -> P5
  # ==========================================================

  - [-1, 1, Conv, [512, 3, 2]]                            # 34
  - [[-1, 23], 1, Concat, [1]]                            # 35
  - [-1, 3, C3, [1024, False]]                            # 36 P5/32


  # ==========================================================
  # OBB head unchanged
  # ==========================================================

  - [[30, 33, 36], 1, OBB, [nc, 1]]                      # 37