# Ultralytics YOLO 🚀, AGPL-3.0 license
#
# 来源与唯一改动：
# 本文件以 yolov8s-DarkAct-TargetSaliency-PaperLAF-P345-v1.yaml 为父实验，
# 仅将 StaticMAAContext2D 内部的 matmul/scale/softmax/matmul 用 FP32 计算，
# 然后转回原 dtype。保留 sqrt(active_channels) 缩放、所有损失、通道数和拓扑不变。
# 旧类和旧 YAML 不修改，用于隔离验证 FP16 注意力累加溢出。

nc: 5
target_saliency_loss_gain: 0.05
target_saliency_stage_weights: [1.0, 1.0, 1.0]
target_saliency_mask_tolerance: 0.5

scales:
  # n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]
scale: s

backbone:
  # RGB 分支到 P3/8。
  - [-5, 1, Conv, [64, 3, 2]]
  - [-5, 1, Conv, [128, 3, 2]]
  - [-5, 3, C2f, [128, True]]
  - [-5, 1, Conv, [256, 3, 2]]

  # IR 分支到 P3/8。
  - [-6, 1, Conv, [64, 3, 2]]
  - [-6, 1, Conv, [128, 3, 2]]
  - [-6, 3, C2f_Faster, [128, True]]
  - [-6, 1, Conv, [256, 3, 2]]

  # P3：仅目标显著性 context 内部 attention 改为 FP32-safe。
  - [-5, 6, C2f, [256, True]]
  - [-6, 6, C2f_Faster, [256, True]]
  - [[8, 9], 1, StaticMAAContext2DFP32Safe, [256, 4, 1, [3, 5], 3]]
  - [[10, 8, 9], 1, TargetSaliencyPaperLAFMergeFeedback2D, [256, 1, 3]]

  - [-5, 1, Conv, [512, 3, 2]]
  - [-6, 1, Conv, [512, 3, 2]]
  - [-5, 6, C2f, [512, True]]
  - [-6, 6, C2f_Faster, [512, True]]
  - [[14, 15], 1, StaticMAAContext2DFP32Safe, [512, 4, 2, [3, 5], 3]]
  - [[16, 14, 15], 1, TargetSaliencyPaperLAFMergeFeedback2D, [512, 2, 3]]

  - [-5, 1, Conv, [1024, 3, 2]]
  - [-6, 1, Conv, [1024, 3, 2]]
  - [-5, 3, C2f, [1024, True]]
  - [-5, 1, SPPF, [1024, 5]]
  - [-6, 3, C2f_Faster, [1024, True]]
  - [-6, 1, SPPF, [1024, 5]]
  - [[21, 23], 1, StaticMAAContext2DFP32Safe, [1024, 4, 2, [3, 5], 3]]
  - [[24, 21, 23], 1, TargetSaliencyPaperLAFMergeFeedback2D, [1024, 2, 3]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 17], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 28], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 25], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]
  - [[31, 34, 37], 1, OBB, [nc, 1]]
