# Ultralytics YOLO 🚀, AGPL-3.0 license
#
# 本架构将 DarkAct 中针对 RGB/热红外双流视频设计的 MAA/LAF 思想，迁移为适用于 RGB/热红外双模态图片目标检测的新架构。
# 本 YAML 是独立的新架构族，不修改任何原有 YAML 的结构和模块名。
#
# 在原 RIFusion 位置（第 8/13/18 层）放置单帧版 MAA2D：
#   D_m = |F_m - AvgPool_3x3(F_m)|
#   Y_m = F_m * (1 + beta_m * S_m)
# RGB 和 IR 分别使用各自的局部对比度、边缘和纹理生成显著性掩码，
# 不直接计算 RGB-IR 差异，避免将光谱差异和空间错位误判为显著目标。
#
# 在原 ADD 位置（第 23/24/25 层）放置 LAFMerge2D：
#   - 通过 RGB/IR 特征的全局平均池化和最大池化估计通道可靠性；
#   - 通过每个模态自身的局部对比度估计空间可靠性；
#   - 仅使用 C/4 通道执行跨模态 Value 注意力；
#   - 使用膨胀深度卷积完成局部投影，增强对 RGB/IR 小范围空间错位的容忍性。
# 模态门控输出层和跨模态残差系数采用零初始化，因此模型训练初始时
# 严格等价于 baseline 的 RGB + IR 固定相加，然后再学习光照自适应模态权重。

nc: 5
scales:
  # n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]
scale: s

backbone:
  # RGB 分支：从输入逐步下采样至 P3/8。
  - [-1, 1, Conv, [64, 3, 2]]                         # 0 RGB-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                        # 1 RGB-P2/4
  - [-1, 3, C2f, [128, True]]                         # 2
  - [-1, 1, Conv, [256, 3, 2]]                        # 3 RGB-P3/8

  # IR 分支：从输入逐步下采样至 P3/8。
  - [-4, 1, Conv, [64, 3, 2]]                         # 4 IR-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                        # 5
  - [-1, 3, C2f_Faster, [128, True]]                  # 6
  - [-1, 1, Conv, [256, 3, 2]]                        # 7 IR-P3/8

  # P3 静态显著性增强：RGB 和 IR 独立计算；s 尺度下实际通道数 C=128。
  - [-3, 1, MAA2D, [256, 1, 8]]                       # 8
  - [-4, 6, C2f, [256, True]]                         # 9 RGB-P3
  - [-1, 1, Conv, [512, 3, 2]]                        # 10 RGB-P4/16
  - [-4, 6, C2f_Faster, [256, True]]                  # 11 IR-P3
  - [-1, 1, Conv, [512, 3, 2]]                        # 12 IR-P4/16

  # P4 静态显著性增强：dilation=2，扩大容忍空间错位的局部邻域。
  - [-3, 1, MAA2D, [512, 2, 8]]                       # 13
  - [-4, 6, C2f, [512, True]]                         # 14 RGB-P4
  - [-1, 1, Conv, [1024, 3, 2]]                       # 15 RGB-P5/32
  - [-4, 6, C2f_Faster, [512, True]]                  # 16 IR-P4
  - [-1, 1, Conv, [1024, 3, 2]]                       # 17 IR-P5/32

  # P5 静态显著性增强：在末端语义特征提取之前分别增强两个模态。
  - [-3, 1, MAA2D, [1024, 2, 8]]                      # 18
  - [-4, 3, C2f, [1024, True]]                        # 19 RGB-P5
  - [-1, 1, SPPF, [1024, 5]]                          # 20
  - [-4, 3, C2f_Faster, [1024, True]]                 # 21 IR-P5
  - [-1, 1, SPPF, [1024, 5]]                          # 22

  # 用光照自适应融合替换原来的固定 ADD。参数含义：
  # [未经宽度缩放的通道数, 注意力头数, 部分通道比例, 膨胀率, 门控通道压缩比]
  - [[9, 11], 1, LAFMerge2D, [256, 2, 4, 1, 8]]       # 23 P3
  - [[14, 16], 1, LAFMerge2D, [512, 4, 4, 2, 8]]      # 24 P4
  - [[20, 22], 1, LAFMerge2D, [1024, 8, 4, 2, 8]]     # 25 P5

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 26
  - [[-1, 24], 1, Concat, [1]]                        # 27
  - [-1, 3, C2f, [512]]                               # 28
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 29
  - [[-1, 23], 1, Concat, [1]]                        # 30
  - [-1, 3, C2f, [256]]                               # 31 P3/8
  - [-1, 1, Conv, [256, 3, 2]]                        # 32
  - [[-1, 28], 1, Concat, [1]]                        # 33
  - [-1, 3, C2f, [512]]                               # 34 P4/16
  - [-1, 1, Conv, [512, 3, 2]]                        # 35
  - [[-1, 25], 1, Concat, [1]]                        # 36
  - [-1, 3, C2f, [1024]]                              # 37 P5/32
  - [[31, 34, 37], 1, OBB, [nc, 1]]                   # 38
