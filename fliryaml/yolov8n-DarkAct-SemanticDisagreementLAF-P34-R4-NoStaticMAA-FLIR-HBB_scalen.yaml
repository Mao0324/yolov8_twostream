# FLIR HBB scale-n (YOLOv8n) variant of
# yaml/yolov8s-DarkAct-SemanticDisagreementLAF-P34-R4-NoStaticMAA-v1_scalen.yaml.
#
# The reference file is explicitly scale n despite its yolov8s filename. This
# variant preserves that backbone/fusion topology, uses the three FLIR classes
# car/person/bicycle, and changes the terminal OBB head required for rotated
# boxes to Detect for horizontal bounding boxes.

nc: 3
scales:
  n: [0.33, 0.25, 1024]

scale: n

backbone:
  - [-5, 1, Conv, [64, 3, 2]]                              # 0 RGB-P1/2
  - [-5, 1, Conv, [128, 3, 2]]                             # 1 RGB-P2/4
  - [-5, 3, C2f, [128, True]]                              # 2
  - [-5, 1, Conv, [256, 3, 2]]                             # 3 RGB-P3/8
  - [-6, 1, Conv, [64, 3, 2]]                              # 4 IR-P1/2
  - [-6, 1, Conv, [128, 3, 2]]                             # 5 IR-P2/4
  - [-6, 3, C2f_Faster, [128, True]]                       # 6
  - [-6, 1, Conv, [256, 3, 2]]                             # 7 IR-P3/8

  - [-5, 6, C2f, [256, True]]                              # 8 RGB-P3
  - [-6, 6, C2f_Faster, [256, True]]                       # 9 IR-P3
  - [[8, 9], 1, SemanticDisagreementLAFMergeFeedback2D,
     [256, 2, 4, 1, 8, 4]]                                 # 10 P3 semantic fusion/feedback

  - [-5, 1, Conv, [512, 3, 2]]                             # 11 RGB-P4/16
  - [-6, 1, Conv, [512, 3, 2]]                             # 12 IR-P4/16
  - [-5, 6, C2f, [512, True]]                              # 13 RGB-P4
  - [-6, 6, C2f_Faster, [512, True]]                       # 14 IR-P4
  - [[13, 14], 1, SemanticDisagreementLAFMergeFeedback2D,
     [512, 4, 4, 2, 8, 4]]                                 # 15 P4 semantic fusion/feedback

  - [-5, 1, Conv, [1024, 3, 2]]                            # 16 RGB-P5/32
  - [-6, 1, Conv, [1024, 3, 2]]                            # 17 IR-P5/32
  - [-5, 3, C2f, [1024, True]]                             # 18 RGB-P5
  - [-5, 1, SPPF, [1024, 5]]                               # 19
  - [-6, 3, C2f_Faster, [1024, True]]                      # 20 IR-P5
  - [-6, 1, SPPF, [1024, 5]]                               # 21
  - [[19, 21], 1, LAFMergeFeedback2D, [1024, 8, 4, 2, 8]]  # 22 unchanged P5

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]             # 23
  - [[-1, 15], 1, Concat, [1]]                             # 24
  - [-1, 3, C2f, [512]]                                    # 25
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]             # 26
  - [[-1, 10], 1, Concat, [1]]                             # 27
  - [-1, 3, C2f, [256]]                                    # 28 P3/8
  - [-1, 1, Conv, [256, 3, 2]]                             # 29
  - [[-1, 25], 1, Concat, [1]]                             # 30
  - [-1, 3, C2f, [512]]                                    # 31 P4/16
  - [-1, 1, Conv, [512, 3, 2]]                             # 32
  - [[-1, 22], 1, Concat, [1]]                             # 33
  - [-1, 3, C2f, [1024]]                                   # 34 P5/32
  - [[28, 31, 34], 1, Detect, [nc]]                        # 35 HBB head
